name: peliculas-docker

services:
  mongodb:
    image: mongo:8
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand({ ping: 1 }).ok === 1 ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    image: peliculas-app
    environment:
      MONGODB_URI: mongodb://mongodb:27017/movies
    ports:
      - "3000:3000"
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  mongodb_data: